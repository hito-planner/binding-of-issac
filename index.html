<!DOCTYPE html>
<html>
    <head>
        <title>The Binding of Isaac</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="ruffle/ruffle.js"></script>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: #000;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
            }

            #game-container {
                width: 100vw;
                height: 100vh;
                max-width: 100%;
                max-height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* Forces the Ruffle canvas to fill the container dynamically */
            ruffle-embed, ruffle-player {
                width: 100% !important;
                height: 100% !important;
            }
        </style>
    </head>
    <body>
        <div id="game-container"></div>

        <script>
            window.RufflePlayer = window.RufflePlayer || {};
            window.addEventListener("load", (event) => {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                const container = document.getElementById("game-container");
                
                container.appendChild(player);
                
                player.load({
                    url: "thebindingofisaac.swf",
                    allowScriptAccess: true,
                    autoplay: "on",
                    // Tells Ruffle to scale the SWF content to fit the browser window
                    scale: "showAll",
                    letterbox: "on"
                });
            });
        </script>
    </body>
</html>
