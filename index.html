<!DOCTYPE html>
<html>
    <head>
        <title>The Binding of Isaac</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script>
            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
                allowScriptAccess: true,
                autoplay: "on",
                unmuteOverlay: "hidden",

                quality: "high",
                preferredRenderer: "webgpu"
            };
        </script>

        <script src="ruffle/ruffle.js"></script>

        <style>
            html, body {
                margin: 0;
                padding: 0;
                background-color: #0d0d11;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            #game-container {
                width: 640px;
                height: 480px;
                background-color: #000;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
                border-radius: 8px;
                overflow: hidden;
                border: 1px solid #2a2a35;
            }

            ruffle-embed, ruffle-player {
                display: block !important;
                width: 640px !important;
                height: 480px !important;
            }
        </style>
    </head>
    <body>
        <div id="scale-controls" style="position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; gap: 8px; background: #181820; padding: 10px 14px; border-radius: 8px; border: 1px solid #2e2e3d; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            <button onclick="setScale(1)" style="background:#2b2b3a;color:#fff;border:1px solid #44445a;padding:6px 12px;border-radius:6px;cursor:pointer;">1x</button>
            <button onclick="setScale(1.25)" style="background:#2b2b3a;color:#fff;border:1px solid #44445a;padding:6px 12px;border-radius:6px;cursor:pointer;">1.25x</button>
            <button onclick="setScale(1.5)" style="background:#2b2b3a;color:#fff;border:1px solid #44445a;padding:6px 12px;border-radius:6px;cursor:pointer;">1.5x</button>
            <button onclick="setScale(1.75)" style="background:#2b2b3a;color:#fff;border:1px solid #44445a;padding:6px 12px;border-radius:6px;cursor:pointer;">1.75x</button>
            <button onclick="setScale(2)" style="background:#2b2b3a;color:#fff;border:1px solid #44445a;padding:6px 12px;border-radius:6px;cursor:pointer;">2x</button>
        </div>
        <div id="game-container"></div>

        <script>
            function setScale(factor) {
                document.getElementById("game-container").style.transform = "scale(" + factor + ")";
            }
        </script>

        <script>
            window.addEventListener("load", () => {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                document.getElementById("game-container").appendChild(player);

                player.style.width = "640px";
                player.style.height = "480px";

                player.load({
                    url: "thebindingofisaac.swf",
                    allowScriptAccess: true,
                    scale: "showAll",
                    letterbox: "off"
                });
            });
        </script>
    </body>
</html>
