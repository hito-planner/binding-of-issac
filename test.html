<!DOCTYPE html>
<html>
    <head>
        <title>The Binding of Isaac (swf2js test)</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script type="text/javascript" src="swf2js.js"></script>

        <style>
            html, body {
                margin: 0;
                padding: 0;
                background-color: #0d0d11;
                height: 100%;
            }

            #game-container {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                margin: auto;
                width: 800px;
                height: 600px;
            }
        </style>
    </head>
    <body>
        <div id="game-container"></div>

        <script type="text/javascript">
            window.addEventListener("load", () => {
                swf2js.load("thebindingofisaac.swf", {
                    tagId: "game-container"
                });
            });
        </script>
    </body>
</html>
